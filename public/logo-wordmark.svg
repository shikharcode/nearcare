<svg width="1060" height="320" viewBox="0 0 1060 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Icon square -->
  <rect x="16" y="16" width="288" height="288" rx="60" fill="url(#g1)"/>
  <path d="M160 260C160 260 66 196 66 136C66 103 90 82 116 82C134 82 150 92 160 108C170 92 186 82 204 82C230 82 254 103 254 136C254 196 160 260 160 260Z" fill="white" fill-opacity="0.93"/>
  <polyline points="74,140 101,140 115,116 130,168 142,130 155,140 250,140" fill="none" stroke="url(#g2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- NearCare wordmark — no gap, one continuous word split by weight -->
  <!-- "Near" bold blue-violet gradient -->
  <text x="338" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="140" font-weight="800" letter-spacing="-4" fill="url(#g1)">Near</text>
  <!-- "Care" light — dark on light bg, light on dark bg — using two overlapping versions -->
  <!-- Light mode version (dark text) -->
  <text x="694" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="140" font-weight="300" letter-spacing="-4" fill="#1e293b" class="light-text">Care</text>

  <!-- Tagline -->
  <text x="340" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="500" letter-spacing="8" fill="#94a3b8">YOUR PERSONAL HEALTH OS</text>

  <style>
    @media (prefers-color-scheme: dark) {
      .light-text { fill: #f1f5f9; }
    }
  </style>
</svg>
